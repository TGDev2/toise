# Déploiement production sur VPS.
#   1. Copier .env.example vers .env et renseigner TOUTES les valeurs.
#   2. docker compose -f docker-compose.prod.yml up -d --build
# Un reverse proxy (Caddy recommandé, TLS automatique) doit exposer :
#   - web  (port 3000)  → https://votre-domaine.fr
#   - api  (port 3001)  → https://api.votre-domaine.fr (ou /api sur le même domaine)
# Voir docs/DEPLOY.md — section "Déploiement continu (CD)" pour le flux automatisé
# (api/web sont alors mis à jour via `image:`/IMAGE_TAG plutôt que reconstruits
# ici).
#
# Le service de vision par ordinateur (apps/cv-service) est débranché de la
# production (ADR 0001 D2) : il reste dans le dépôt mais ne fait plus partie
# de cette pile. Condition de réouverture : docs/adr/0001-cible-et-perimetre-v1.md §5.2.

name: chiffreo

services:
  postgres:
    image: postgres:16-alpine
    container_name: chiffreo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chiffreo}
      POSTGRES_USER: ${DB_USERNAME:-chiffreo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-chiffreo} -d ${DB_NAME:-chiffreo}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # `image:` sert au flux CD (`docker compose pull` sur le VPS, cf. DEPLOY.md) ;
    # `build:` reste le secours pour une construction manuelle depuis les sources.
    image: ghcr.io/tgdev2/chiffreo-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chiffreo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Un seul saut de proxy (Caddy, cf. l'en-tête de ce fichier). Sans cette
      # ligne, `req.ip` vaut l'IP du proxy et *tout* le trafic partage un unique
      # compteur de rate limiting. À ajuster si la chaîne compte d'autres
      # proxys de confiance en amont.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-chiffreo}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
      DB_NAME: ${DB_NAME:-chiffreo}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requis}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL requis}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
      STRIPE_CONTRACTOR_ESSENTIEL_PRICE_ID: ${STRIPE_CONTRACTOR_ESSENTIEL_PRICE_ID:-}
      STRIPE_CONTRACTOR_STANDARD_PRICE_ID: ${STRIPE_CONTRACTOR_STANDARD_PRICE_ID:-}
      STRIPE_CONTRACTOR_PREMIUM_PRICE_ID: ${STRIPE_CONTRACTOR_PREMIUM_PRICE_ID:-}
      BREVO_API_KEY: ${BREVO_API_KEY:?}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:?}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Chiffréo}
      # Débranché de la production (ADR 0001 D2) : coupure-circuit lu par
      # apps/api/src/analysis/, indépendant de la gate DB `cv_analysis`.
      CV_ENABLED: ${CV_ENABLED:-false}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/uploads
      MANOMANO_ENABLED: ${MANOMANO_ENABLED:-false}
      MANOMANO_FEED_URL: ${MANOMANO_FEED_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
    volumes:
      - uploads:/app/uploads
    ports:
      - '127.0.0.1:3001:3001'
    healthcheck:
      # `127.0.0.1` et non `localhost` : voir le healthcheck de `web`.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    # Voir le commentaire sur `api.image` ci-dessus : même logique CD/secours.
    image: ghcr.io/tgdev2/chiffreo-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL requis}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL requis}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.2}
    container_name: chiffreo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      # `/api/health` (route Next, pas l'API) plutôt que la page d'accueil : le
      # rendu de l'accueil est coûteux, et surtout « sain » doit vouloir dire
      # « testable » — c'est l'endpoint exact qu'interroge ensuite le test de
      # fumée du déploiement (docs/deploy/smoke-test.sh).
      #
      # `127.0.0.1` et non `localhost`, sans quoi ce conteneur est **toujours**
      # en échec : le `/etc/hosts` de Docker fait résoudre `localhost` en `::1`
      # d'abord, et le serveur Next n'écoute qu'en IPv4 (`HOSTNAME=0.0.0.0`).
      # BusyBox wget s'arrête au premier refus de connexion. Le défaut existait
      # avant ce healthcheck-ci et restait invisible : rien ne consommait l'état
      # de santé de `web` tant que le déploiement ne l'attendait pas.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  uploads:
