name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  api:
    name: API (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/api lint
      - run: pnpm --filter @chiffreo/api build
      # Placé avant les tests unitaires, et nommé, parce qu'une dérive de
      # quantité doit porter son nom dans la CI plutôt que d'être noyée dans
      # 1 000+ tests. Le harnais tourne donc deux fois — quelques secondes de
      # calcul pur, sans base : le prix de l'attribution immédiate.
      #
      # `--ci` est explicite dans le script. Sans lui, jest **écrit** un
      # instantané manquant et passe au vert : une suite dont le `.snap` n'a
      # jamais été committé attesterait alors exactement ce qu'elle vient de
      # constater. (`CI=true` suffirait ici ; l'écrire rend la garantie vraie
      # aussi en local, où elle se vérifie.)
      - name: Harnais de non-régression du moteur (catalogue seedé)
        run: pnpm --filter @chiffreo/api test:engine-regression
      - name: Tests unitaires
        run: pnpm --filter @chiffreo/api test
      # Nom explicite : ces suites montent des contrôleurs avec services mockés
      # et guards surchargés. Elles vérifient le contrat HTTP (DTO, pipes, codes
      # de statut) — pas l'intégration. Ce que le vert ici ne dit pas est couvert
      # par le job `api-integration`. Cf. apps/api/test/README.md.
      - name: Tests de contrat HTTP (services mockés)
        run: pnpm --filter @chiffreo/api test:e2e

  migrations:
    name: Migrations (compatibilité ascendante)
    runs-on: ubuntu-latest
    # Un retour arrière de production se contente de repasser les images —
    # à condition que les migrations de la version soient additives. Ce job
    # refuse qu'une migration destructive parte sans que quiconque ait décidé
    # d'en faire un point de non-retour. Doctrine : docs/deploy/MIGRATIONS.md.
    steps:
      # fetch-depth: 0 : le contrôle porte sur les migrations *ajoutées* par
      # rapport à main, pas sur les 79 déjà en place.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrations ajoutées depuis main
        run: |
          set -euo pipefail
          # Appelé par la CD sur un tag, `origin/main` peut être absent du
          # checkout : on retombe sur HEAD, le delta est alors vide, et c'est la
          # CD qui compare ce qui compte pour une release —
          # <tag précédent>..<tag>.
          BASE=origin/main
          git rev-parse --verify --quiet "$BASE" >/dev/null || BASE=HEAD
          node docs/deploy/check-migration-compat.mjs --base "$BASE"

  api-integration:
    name: API (intégration, PostgreSQL réel)
    runs-on: ubuntu-latest
    # Ce que le job `api` ne peut pas voir, faute de base : validité et
    # réversibilité des migrations, dérive entités ↔ schéma, portée réelle des
    # cascades de suppression, contraintes d'unicité, écritures concurrentes.
    # Deux défauts de production sont nés précisément dans cet angle mort
    # (idempotence des webhooks Stripe, perte de mise à jour JSONB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chiffreo
          POSTGRES_USER: chiffreo
          POSTGRES_PASSWORD: chiffreo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiffreo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/api test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: chiffreo
          DB_PASSWORD: chiffreo_dev

  web:
    name: Web (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/web lint
      - run: pnpm --filter @chiffreo/web test
      - run: pnpm --filter @chiffreo/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  web-e2e:
    name: Web (E2E navigateur)
    runs-on: ubuntu-latest
    # Les deux seuls scénarios navigateur du dépôt (E2-6) : parcours invité
    # jusqu'à la liste d'achat, et parcours artisan jusqu'au PDF du devis.
    # Postgres et Playwright montent ici une pile complète (API compilée,
    # émulateur Firebase Auth, Next en mode dev) — c'est le seul job qui
    # exerce le produit par un vrai navigateur plutôt que par ses tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chiffreo
          POSTGRES_USER: chiffreo
          POSTGRES_PASSWORD: chiffreo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiffreo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/api build
      - name: Migre la base
        run: node apps/api/dist/scripts/migrate.js
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: chiffreo
          DB_PASSWORD: chiffreo_dev
          DB_NAME: chiffreo
      - run: pnpm --filter @chiffreo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @chiffreo/web test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: chiffreo
          DB_PASSWORD: chiffreo_dev
          DB_NAME: chiffreo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  audit:
    name: Dépendances (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bloquant, sur les seules dépendances qui atteignent la production.
      # Le seuil est « critique » et pas « high » parce qu'un seuil que la CI
      # ne peut pas tenir n'est pas une barrière : 41 advisories `high`
      # transitives sont ouvertes à ce jour. Le rôle de cette étape est
      # d'empêcher l'**arrivée** d'une nouvelle faille critique dans le code
      # livré, pas de prétendre que l'arbre est propre.
      - name: Audit bloquant (prod, critique)
        run: pnpm audit --prod --audit-level critical
      # Non bloquant : rend l'état réel visible sur chaque PR, y compris pour
      # les dépendances de développement, sans faire du rouge permanent.
      - name: Audit informatif (tout, high)
        run: pnpm audit --audit-level high || true

  cv-service:
    name: CV service (compile check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cv-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifie la syntaxe Python
        run: python -m compileall app training tests
      - name: Installe les dépendances de test (sans les poids lourds ML)
        # Tout `requirements.txt` **sauf** torch/transformers/ultralytics :
        # plusieurs centaines de Mo, et seul `app/services/depth_estimator.py`
        # les importe — aucun test ne le charge.
        #
        # Exclure plutôt qu'énumérer, délibérément. La liste blanche
        # précédente a été prise en défaut deux fois : d'abord sur un OpenCV
        # non épinglé, puis quand `test_service_auth.py` a importé `fastapi`,
        # absent de la liste — la CI est alors rouge sur un import, pas sur un
        # défaut. Ici l'oubli est sûr : une nouvelle dépendance légère est
        # installée sans que personne n'ait à y penser, et seul l'ajout d'un
        # poids lourd demande une décision explicite, à un endroit visible.
        #
        # Les versions restent **celles de requirements.txt**, jamais
        # ressaisies : les seuils de `HoughLinesP` et consorts bougent entre
        # versions mineures d'OpenCV, et une CI verte sur une autre version
        # atteste du comportement d'un binaire qui ne tournera jamais en prod.
        run: |
          set -euo pipefail
          grep -vE '^(torch|transformers|ultralytics)==' requirements.txt > /tmp/requirements-ci.txt
          printf 'Dépendances CI (issues de requirements.txt) :\n'
          # `cat` et non un second `grep` : sous `set -e`, un grep sans
          # correspondance renvoie 1 et tuerait l'étape pour un affichage.
          cat /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt "pytest==8.3.4"
      - name: Tests CV
        run: pytest tests -q
