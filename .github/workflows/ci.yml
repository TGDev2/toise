name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/api lint
      - run: pnpm --filter @chiffreo/api build
      - run: pnpm --filter @chiffreo/api test

  web:
    name: Web (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/web lint
      - run: pnpm --filter @chiffreo/web test
      - run: pnpm --filter @chiffreo/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  cv-service:
    name: CV service (compile check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cv-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifie la syntaxe Python
        run: python -m compileall app
