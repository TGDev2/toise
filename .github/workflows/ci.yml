name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  api:
    name: API (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/api lint
      - run: pnpm --filter @chiffreo/api build
      - name: Tests unitaires
        run: pnpm --filter @chiffreo/api test
      # Nom explicite : ces suites montent des contrôleurs avec services mockés
      # et guards surchargés. Elles vérifient le contrat HTTP (DTO, pipes, codes
      # de statut) — pas l'intégration. Ce que le vert ici ne dit pas est couvert
      # par le job `api-integration`. Cf. apps/api/test/README.md.
      - name: Tests de contrat HTTP (services mockés)
        run: pnpm --filter @chiffreo/api test:e2e

  api-integration:
    name: API (intégration, PostgreSQL réel)
    runs-on: ubuntu-latest
    # Ce que le job `api` ne peut pas voir, faute de base : validité et
    # réversibilité des migrations, dérive entités ↔ schéma, portée réelle des
    # cascades de suppression, contraintes d'unicité, écritures concurrentes.
    # Deux défauts de production sont nés précisément dans cet angle mort
    # (idempotence des webhooks Stripe, perte de mise à jour JSONB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chiffreo
          POSTGRES_USER: chiffreo
          POSTGRES_PASSWORD: chiffreo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiffreo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/api test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: chiffreo
          DB_PASSWORD: chiffreo_dev

  web:
    name: Web (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/web lint
      - run: pnpm --filter @chiffreo/web test
      - run: pnpm --filter @chiffreo/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  widget:
    name: Widget (lint, tests, build)
    runs-on: ubuntu-latest
    # Le widget s'exécute chez des tiers, sur leurs pages : c'est la seule
    # surface dont une régression est vue par un client avant d'être vue par
    # nous. `apps/widget/src/widget.spec.ts` existait sans qu'aucun job ne
    # l'exécute.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/widget lint
      - run: pnpm --filter @chiffreo/widget test
      - run: pnpm --filter @chiffreo/widget build

  audit:
    name: Dépendances (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bloquant, sur les seules dépendances qui atteignent la production.
      # Le seuil est « critique » et pas « high » parce qu'un seuil que la CI
      # ne peut pas tenir n'est pas une barrière : 41 advisories `high`
      # transitives sont ouvertes à ce jour. Le rôle de cette étape est
      # d'empêcher l'**arrivée** d'une nouvelle faille critique dans le code
      # livré, pas de prétendre que l'arbre est propre.
      - name: Audit bloquant (prod, critique)
        run: pnpm audit --prod --audit-level critical
      # Non bloquant : rend l'état réel visible sur chaque PR, y compris pour
      # les dépendances de développement, sans faire du rouge permanent.
      - name: Audit informatif (tout, high)
        run: pnpm audit --audit-level high || true

  cv-service:
    name: CV service (compile check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cv-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifie la syntaxe Python
        run: python -m compileall app training tests
      - name: Installe cv2/numpy + pytest
        # Le détecteur de référence et le pipeline de dimensions ne dépendent
        # que d'OpenCV/numpy/pydantic/Pillow/pillow-heif (pas de
        # torch/transformers), donc on n'installe pas tout requirements.txt
        # (lourd) pour la CI. `pillow-heif` en fait partie parce que le
        # chargement d'image HEIC est justement ce qui manquait sans qu'aucun
        # test ne puisse le voir.
        #
        # En revanche les versions sont **extraites de requirements.txt**, pas
        # ressaisies : une liste allégée qu'on ré-épingle à la main se
        # désynchronise, et une CI verte atteste alors du comportement d'un
        # OpenCV qui ne tournera jamais en production. Les seuils de
        # `HoughLinesP` et consorts bougent entre versions mineures — c'est
        # exactement l'API dont dépend la détection de lignes du pipeline.
        run: |
          set -euo pipefail
          pins=$(grep -E '^(opencv-python-headless|numpy|pydantic|pydantic-settings|Pillow|pillow-heif)==' requirements.txt)
          test "$(printf '%s\n' "$pins" | wc -l)" -eq 6 \
            || { echo "requirements.txt a changé : le sous-ensemble CI ne résout plus 6 paquets"; printf '%s\n' "$pins"; exit 1; }
          printf 'Versions CI (issues de requirements.txt) :\n%s\n' "$pins"
          printf '%s\n' "$pins" | xargs pip install "pytest==8.3.4"
      - name: Tests CV
        run: pytest tests -q
