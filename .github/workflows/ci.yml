name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  api:
    name: API (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/api lint
      - run: pnpm --filter @chiffreo/api build
      - run: pnpm --filter @chiffreo/api test
      - run: pnpm --filter @chiffreo/api test:e2e

  web:
    name: Web (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chiffreo/web lint
      - run: pnpm --filter @chiffreo/web test
      - run: pnpm --filter @chiffreo/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  cv-service:
    name: CV service (compile check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cv-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifie la syntaxe Python
        run: python -m compileall app training tests
      - name: Installe cv2/numpy + pytest
        # Le détecteur de référence ne dépend que d'OpenCV/numpy (pas de torch),
        # donc on n'installe pas tout requirements.txt (lourd) pour la CI.
        run: pip install opencv-python-headless numpy pydantic "pytest>=8.0"
      - name: Tests CV
        run: pytest tests -q
