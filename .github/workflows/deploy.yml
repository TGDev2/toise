name: CD

# Sur un tag vX.Y.Z : rejoue la CI (ci.yml en workflow_call), build+push les images
# api/web/cv vers GHCR, puis déploie sur le VPS par SSH (docker compose pull/up).
# Voir docs/DEPLOY.md — section "Déploiement continu (CD)" pour les secrets requis.
#
# Les trois services partent ensemble et portent le même `IMAGE_TAG`. L'API et le
# service CV partagent un contrat HTTP (`AnalyzeRequest`/`AnalyzeResponse`) qui
# n'est ni versionné ni négocié : les livrer séparément, c'est accepter qu'un tag
# déploie une API neuve contre un CV ancien, et découvrir l'incompatibilité en
# 422 sur le trafic réel.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/tgdev2/chiffreo-api
  WEB_IMAGE: ghcr.io/tgdev2/chiffreo-web
  CV_IMAGE: ghcr.io/tgdev2/chiffreo-cv

jobs:
  ci:
    name: CI (gate)
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & push les images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.ref_name }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.ref_name }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Les poids YOLO ne sont pas dans git (cf. .gitignore) : ce sont des
      # artefacts de release `cv-model-vN`, et le Dockerfile fait `COPY models/`.
      # Sans cette étape, l'image publiée serait construite avec un `models/`
      # vide et le service basculerait en mode heuristique — un conteneur
      # dégradé prenant silencieusement la place d'un conteneur équipé.
      # L'étape est donc **bloquante** : mieux vaut un déploiement qui s'arrête
      # qu'une précision qui baisse sans que rien ne le dise.
      - name: Récupère les poids du détecteur portes/fenêtres
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `bash …` et non `./…` : les scripts du dépôt sont committés en 644.
          bash apps/cv-service/scripts/fetch-model.sh ${{ vars.CV_MODEL_TAG }}
          test -s apps/cv-service/models/door-window-yolov8n.pt

      - name: Build & push cv-service
        uses: docker/build-push-action@v6
        with:
          context: apps/cv-service
          file: apps/cv-service/Dockerfile
          push: true
          tags: |
            ${{ env.CV_IMAGE }}:${{ github.ref_name }}
            ${{ env.CV_IMAGE }}:latest
          cache-from: type=gha,scope=cv
          cache-to: type=gha,mode=max,scope=cv

  deploy:
    name: Déploiement VPS
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure la clé SSH et le known_hosts épinglé
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronise docker-compose.prod.yml sur le VPS
        run: |
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/opt/chiffreo/docker-compose.prod.yml"

      - name: Pull + redémarre api/web/cv-service sur le VPS
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "set -euo pipefail
             docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             cd /opt/chiffreo
             IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml pull api web cv-service
             IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml up -d api web cv-service
             docker image prune -f
             docker logout ghcr.io"
