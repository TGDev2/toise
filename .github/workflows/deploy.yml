name: CD

# Sur un tag vX.Y.Z : rejoue la CI (ci.yml en workflow_call), build+push les images
# api/web vers GHCR, puis déploie sur le VPS par SSH.
# Voir docs/DEPLOY.md — section "Déploiement continu (CD)" pour les secrets requis.
#
# Le déploiement est bloquant à trois endroits, dans cet ordre :
#   1. point de restauration de la base pris avant tout changement ;
#   2. `up -d --wait`, qui attend les healthchecks au lieu de rendre la main dès
#      le conteneur créé ;
#   3. test de fumée, qui vérifie que les deux services répondent **et** servent
#      le tag attendu.
# Sans (2) et (3), une migration en échec bouclait sous `restart: unless-stopped`
# pendant que ce workflow restait vert.
#
# En échec, rien n'est défait automatiquement : un retour arrière automatique
# ferait tourner l'ancien code contre le nouveau schéma dès que la version
# contient une migration contractante. Le job écrit la procédure dans son
# résumé — cf. docs/deploy/MIGRATIONS.md et docs/DEPLOY.md § Retour arrière.
#
# `cv-service` est débranché de la production (ADR 0001 §D2) : ni construit,
# ni déployé ici.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/tgdev2/toise-api
  WEB_IMAGE: ghcr.io/tgdev2/toise-web

jobs:
  ci:
    name: CI (gate)
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & push les images
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.ref_name }}
            ${{ env.API_IMAGE }}:latest
          # Fige le tag dans l'image : c'est cette valeur que `/api/v1/health`
          # publie et que le test de fumée compare. La déduire de
          # l'environnement du conteneur ferait attester au déploiement ce que
          # le compose croit avoir lancé, pas ce qui tourne.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.ref_name }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Déploiement VPS
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # fetch-depth: 0 pour les tags — l'étape suivante compare cette version à
      # la précédente, et le résumé d'échec doit pouvoir nommer le tag sur
      # lequel revenir.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classe les migrations de cette version (expand / contract)
        id: compat
        # Jamais bloquant ici : à ce stade le tag est publié, et la nature des
        # migrations est un fait à rapporter — pas une décision à reprendre.
        # C'est en revue de PR que le garde-fou refuse une migration
        # destructive non déclarée (ci.yml, job `migrations`).
        run: |
          set -uo pipefail
          PREV_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname \
            | grep -Fxv "$GITHUB_REF_NAME" | head -n1 || true)"
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV_TAG" ]; then
            echo "Première version publiée : aucune comparaison possible."
            echo "compat=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="$(node docs/deploy/check-migration-compat.mjs \
            --base "$PREV_TAG" --head "$GITHUB_REF_NAME" 2>&1)" || true
          echo "$OUT"
          COMPAT="$(printf '%s' "$OUT" | sed -n 's/^COMPAT=//p' | tail -n1)"
          echo "compat=${COMPAT:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Configure la clé SSH et le known_hosts épinglé
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronise docker-compose.prod.yml sur le VPS
        run: |
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/opt/toise/docker-compose.prod.yml"

      # Bloquant, délibérément : déployer sans point de restauration, c'est
      # décider à l'avance que le retour arrière n'aura aucun recours. Le cron
      # nocturne (3h15) ne couvre pas la fenêtre d'un déploiement.
      # Prérequis sur le VPS : clé GPG et /etc/toise/backup.env (BACKUP.md §3).
      #
      # Le script est **poussé par stdin** plutôt qu'exécuté depuis
      # /opt/toise : ce clone n'est mis à jour que par les déploiements
      # manuels, donc rien ne garantit qu'il porte la version du script que
      # cette release attend. Même idiome que provision.sh.
      - name: Point de restauration avant déploiement
        id: backup
        run: |
          set -euo pipefail
          OUT="$(ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "bash -s -- --pre-deploy '${{ github.ref_name }}'" \
            < docs/deploy/backup.sh)"
          echo "$OUT"
          BACKUP_FILE="$(printf '%s' "$OUT" | sed -n 's/^BACKUP_FILE=//p' | tail -n1)"
          [ -n "$BACKUP_FILE" ] || { echo "ERREUR: la sauvegarde n'a nommé aucun fichier" >&2; exit 1; }
          echo "backup_file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"

      - name: Pull + redémarre api/web sur le VPS
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "set -euo pipefail
             docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             # Le logout par trap et non en dernière ligne : sous 'set -e', un
             # déploiement qui casse laissait jusqu'ici l'identifiant de
             # registre en place sur le VPS.
             trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
             cd /opt/toise
             IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml pull api web
             # --wait : attend que les healthchecks passent, et sort non nul
             # sinon. Sans lui, 'up -d' rend la main dès le conteneur créé —
             # une migration en échec (migrate.js, code 3) boucle alors sous
             # 'restart: unless-stopped' pendant que la CD reste verte.
             IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 api web
             docker image prune -f"

      # Ce que --wait ne dit pas : que les conteneurs sains servent bien la
      # version attendue. Un 'pull' qui a resservi l'image précédente laisse une
      # pile parfaitement saine, et périmée.
      - name: Test de fumée
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "bash -s -- --expect-version '${{ github.ref_name }}'" \
            < docs/deploy/smoke-test.sh

      # Aucun geste automatique : les conteneurs et leurs journaux restent en
      # l'état pour le diagnostic, et un retour arrière automatique serait
      # précisément dangereux sur une version contractante. Ce résumé donne à
      # l'opérateur les trois choses qu'il lui faut — sur quoi revenir, avec
      # quel point de restauration, et si la bascule d'images suffit.
      - name: Résumé d'échec — procédure de retour arrière
        if: failure()
        env:
          TAG: ${{ github.ref_name }}
          PREV_TAG: ${{ steps.compat.outputs.previous_tag }}
          COMPAT: ${{ steps.compat.outputs.compat }}
          BACKUP_FILE: ${{ steps.backup.outputs.backup_file }}
        run: |
          {
            echo "## Déploiement \`$TAG\` en échec"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version précédente | \`${PREV_TAG:-inconnue}\` |"
            echo "| Point de restauration | \`${BACKUP_FILE:-aucun (échec avant la sauvegarde)}\` |"
            echo "| Migrations de cette version | \`${COMPAT:-inconnu}\` |"
            echo
            if [ -z "$PREV_TAG" ]; then
              echo "> ⚠️ Aucune version précédente : il n'y a nulle part où revenir."
              echo "> Corriger et republier un tag, ou restaurer le point ci-dessus"
              echo "> si la base a déjà été modifiée."
            elif [ "$COMPAT" = "contract" ]; then
              echo "> ⚠️ Cette version contient une migration **contractante** :"
              echo "> la bascule d'images seule ferait tourner \`$PREV_TAG\` contre un"
              echo "> schéma amputé. Suivre le **chemin de recours** de"
              echo "> \`docs/DEPLOY.md\` § Retour arrière (restauration du point"
              echo "> ci-dessus, avec la perte de toutes les écritures depuis)."
            else
              echo "Retour arrière par bascule d'images, sur le VPS dans \`/opt/toise\` :"
              echo
              echo '```bash'
              echo "IMAGE_TAG=$PREV_TAG docker compose -f docker-compose.prod.yml pull api web"
              echo "IMAGE_TAG=$PREV_TAG docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 api web"
              echo "bash /opt/toise/docs/deploy/smoke-test.sh --expect-version $PREV_TAG"
              echo '```'
              echo
              echo "Le schéma reste en avant : c'est voulu et sûr tant que les"
              echo "migrations de cette version sont additives."
            fi
            echo
            echo "Procédure complète, et ce qui n'est **pas** réversible :"
            echo "\`docs/DEPLOY.md\` § Retour arrière."
          } >> "$GITHUB_STEP_SUMMARY"
