name: toise

services:
  postgres:
    image: postgres:16-alpine
    container_name: toise-db
    environment:
      POSTGRES_DB: toise
      POSTGRES_USER: toise
      POSTGRES_PASSWORD: toise_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  cv-service:
    build:
      context: ./apps/cv-service
      dockerfile: Dockerfile
    container_name: toise-cv
    ports:
      # Lie a la loopback : le service n'a aucune authentification tant
      # que CV_SERVICE_TOKEN n'est pas renseigne, et '8000:8000' l'aurait
      # publie sur toutes les interfaces de la machine de developpement.
      - '127.0.0.1:8000:8000'
    volumes:
      # CV service only reads uploaded images, never writes them.
      # Read-only mount limits blast radius of any future path-traversal bug.
      - ./uploads:/data/uploads:ro
    environment:
      - UPLOADS_PATH=/data/uploads
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
