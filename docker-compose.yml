name: chiffreo

services:
  postgres:
    image: postgres:16-alpine
    container_name: chiffreo-db
    environment:
      POSTGRES_DB: chiffreo
      POSTGRES_USER: chiffreo
      POSTGRES_PASSWORD: chiffreo_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  cv-service:
    build:
      context: ./apps/cv-service
      dockerfile: Dockerfile
    container_name: chiffreo-cv
    ports:
      - '8000:8000'
    volumes:
      # CV service only reads uploaded images, never writes them.
      # Read-only mount limits blast radius of any future path-traversal bug.
      - ./uploads:/data/uploads:ro
    environment:
      - UPLOADS_PATH=/data/uploads
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
