services:
  postgres:
    image: postgres:16-alpine
    container_name: estimate-db
    environment:
      POSTGRES_DB: estimate
      POSTGRES_USER: estimate
      POSTGRES_PASSWORD: estimate_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  cv-service:
    build:
      context: ./apps/cv-service
      dockerfile: Dockerfile
    container_name: estimate-cv
    ports:
      - '8000:8000'
    volumes:
      - ./uploads:/data/uploads
    environment:
      - UPLOADS_PATH=/data/uploads
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
